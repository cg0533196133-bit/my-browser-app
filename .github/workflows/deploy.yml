name: Deploy to Fly.io
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup FlyCTL
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Allocate Private IPv6
        run: flyctl ips allocate-v6 --private -a my-browser-app || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
