app = "my-browser-app"
primary_region = "ams"

[build]
  image = "lscr.io/linuxserver/chromium:latest"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  CUSTOM_PORT = "3000"
  PUID = "1000"
  PGID = "1000"
  TZ = "Etc/UTC"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
