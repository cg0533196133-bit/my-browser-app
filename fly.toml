# fly.toml app configuration file generated for my-browser-app on 2026-09-15T19:40:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'my-browser-app'
primary_region = 'ams'

[build]
  image = 'lscr.io/linuxserver/chromium:latest'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
